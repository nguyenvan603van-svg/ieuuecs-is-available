<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Đức Mod Game</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.6);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #fbbf24;
      --accent-glow: rgba(251, 191, 36, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.3);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0b1120 0%, #1a1f36 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 20px 10px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      max-width: 480px;
      width: 100%;
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px; height: 60px;
      background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(251,191,36,0.05));
      border-radius: 20px;
      border: 1px solid rgba(251,191,36,0.3);
      box-shadow: 0 0 30px var(--accent-glow);
      margin-bottom: 10px;
      font-size: 1.8rem;
      color: var(--accent);
    }
    h1 { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg,#fff,#fbbf24); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .subtitle { color: var(--text-muted); font-size:0.85rem; margin-top: 5px; }
    .subtitle-small { font-size: 0.75rem; margin-top: 8px; }

    .main-tabs { display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap; justify-content:center; }
    .tab-btn { flex:1; min-width:70px; padding:10px 12px; border:none; border-radius: var(--radius); background:var(--card-bg); color:var(--text-muted); border:1px solid var(--card-border); cursor:pointer; font-weight:600; font-size:0.85rem; transition: all var(--transition); position:relative; overflow:hidden; }
    .tab-btn.active { background: linear-gradient(135deg,#fbbf24,#f59e0b); color:#0f172a; border-color:var(--accent); box-shadow:0 0 25px var(--accent-glow); }
    .tab-btn i { margin-right:5px; }

    .sub-tabs-container { display:flex; gap:6px; margin-bottom:15px; flex-wrap:wrap; justify-content:center; }
    .sub-tab-btn { padding:7px 12px; border:none; border-radius:12px; background:rgba(30,41,59,0.5); color:var(--text-muted); border:1px solid var(--card-border); cursor:pointer; font-size:0.75rem; font-weight:500; transition: all var(--transition); }
    .sub-tab-btn.active { background:var(--accent); color:#0f172a; font-weight:700; box-shadow:0 4px 15px var(--accent-glow); }
    .sub-tab-btn i { margin-right:4px; }

    .hidden { display:none !important; }

    .link-card { background:var(--card-bg); backdrop-filter:blur(10px); border:1px solid var(--card-border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:12px; transition:all var(--transition); box-shadow:0 4px 15px rgba(0,0,0,0.2); }
    .link-card:hover { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 12px 30px rgba(0,0,0,0.4); }
    .link-info { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
    .link-icon { width:40px; height:40px; background:rgba(15,23,42,0.7); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:1.2rem; flex-shrink:0; border:1px solid rgba(251,191,36,0.2); }
    .link-text { min-width:0; }
    .link-title { font-size:0.9rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .link-desc { font-size:0.7rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .visit-btn { background:linear-gradient(135deg,#fbbf24,#f59e0b); border:none; color:#0f172a; padding:8px 14px; border-radius:20px; cursor:pointer; font-size:0.75rem; font-weight:700; transition:all var(--transition); white-space:nowrap; }
    .visit-btn:hover { transform:scale(1.05); box-shadow:0 6px 20px rgba(251,191,36,0.5); }
    .empty-message { text-align:center; padding:30px; color:var(--text-muted); font-size:0.85rem; background:rgba(30,41,59,0.3); border-radius:var(--radius); border:1px dashed rgba(255,255,255,0.2); }
    .empty-message i { font-size:2rem; display:block; margin-bottom:10px; opacity:0.6; }

    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
    .modal-overlay.active { display:flex; }
    .modal-content { background:linear-gradient(145deg,#1e293b,#0f172a); border:1px solid var(--accent); border-radius:24px; padding:25px; max-width:320px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
    .modal-icon { font-size:3rem; color:var(--accent); margin-bottom:10px; }
    .modal-title { font-size:1rem; font-weight:700; margin-bottom:8px; }
    .modal-desc { font-size:0.8rem; color:var(--text-muted); margin-bottom:20px; }
    .modal-buttons { display:flex; gap:10px; justify-content:center; }
    .modal-btn { flex:1; padding:10px; border-radius:20px; border:none; font-weight:700; cursor:pointer; font-size:0.8rem; transition: all var(--transition); }
    .btn-cancel { background:rgba(148,163,184,0.2); color:var(--text-main); border:1px solid rgba(255,255,255,0.2); }
    .btn-download { background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#0f172a; box-shadow:0 4px 15px var(--accent-glow); }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><i class="fas fa-link"></i></div>
    <h1>Đức mod game</h1>
    <div class="subtitle">Tất cả đều không phải vượt link ngoại trừ Key</div>
    <div class="subtitle subtitle-small">Các vợ cho trồng xin 1 fl cảm ơn nhiều</div>
  </div>

  <div class="main-tabs" id="mainTabs">
    <button class="tab-btn active" data-main="ios"><i class="fab fa-apple"></i>iOS</button>
    <button class="tab-btn" data-main="adr"><i class="fab fa-android"></i>Android</button>
    <button class="tab-btn" data-main="key"><i class="fas fa-key"></i>Key</button>
    <button class="tab-btn" data-main="modskin"><i class="fas fa-paint-brush"></i>Skin</button>
  </div>

  <div id="subTabsContainer">
    <div class="sub-tabs-container" id="iosSubTabs">
      <button class="sub-tab-btn active" data-sub="filza">Filza</button>
      <button class="sub-tab-btn" data-sub="ipa">IPA</button>
      <button class="sub-tab-btn" data-sub="imazing">iMazing</button>
      <button class="sub-tab-btn" data-sub="proxy">Proxy</button>
      <button class="sub-tab-btn" data-sub="tipa">Tipa</button>
    </div>
    <div class="sub-tabs-container hidden" id="adrSubTabs">
      <button class="sub-tab-btn active" data-sub="menu">Menu</button>
      <button class="sub-tab-btn" data-sub="menuapk">Menu APK</button>
      <button class="sub-tab-btn" data-sub="proxy">Proxy</button>
      <button class="sub-tab-btn" data-sub="fileaim">File Aim</button>
      <button class="sub-tab-btn" data-sub="deta">Deta</button>
    </div>
    <div class="sub-tabs-container hidden" id="keySubTabs">
      <button class="sub-tab-btn active" data-sub="ios">iOS</button>
      <button class="sub-tab-btn" data-sub="android">Android</button>
    </div>
  </div>

  <div id="content"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <div class="modal-icon"><i class="fas fa-download"></i></div>
    <div class="modal-title" id="modalTitle">Tải file</div>
    <div class="modal-desc" id="modalDesc">Bạn có muốn tải file này không?</div>
    <div class="modal-buttons">
      <button class="modal-btn btn-cancel" onclick="closeModal()">Hủy</button>
      <button class="modal-btn btn-download" onclick="confirmDownload()">Tải ngay</button>
    </div>
  </div>
</div>

<script>
  // Dữ liệu
  const data = {
    ios: {
      filza: [
        { title: "aimbody_.zip", url: "https://www.mediafire.com/file/1gaafqmwkq2tas6/aimbody_.zip/file", desc: "Tải file aimbody_.zip", icon: "fa-file-archive" },
        { title: "Định vị", url: "https://www.mediafire.com/file/e1j7qohbybngbhk/Holo_ffm_updated_.zip/file", desc: "Tải file Holo_ffm_updated_.zip", icon: "fa-location-crosshairs" },
        { title: "Bắn tỉa", url: "https://www.mediafire.com/file/seyj7wocmktetxg/MagicTintinXTranUan.zip/file", desc: "Tải file MagicTintinXTranUan.zip", icon: "fa-crosshairs" }
      ],
      ipa: [
        { title: "Free Fire MAX", url: "https://www.mediafire.com/file/pu8llcysd17d8l0/Free+Fire+MAX+Telegram+@ng_thanhhoa.ipa/file", desc: "cần key", icon: "fa-gamepad" },
        { title: "Free Fire 2019", url: "https://www.mediafire.com/file/kz2h4g4xbipx3lb/Free+Fire+2019_1.126.1_1786697174.ipa/file", desc: "Tải Free Fire 2019 IPA", icon: "fa-gamepad" },
        { title: "Menu Aimkill", url: "https://transfer.it/t/UH0TijpVRZBa", desc: "cần key", icon: "fa-crosshairs" }
      ],
      imazing: [],
      proxy: [],
      tipa: [
        { title: "EAGLEIOS.tipa", url: "https://www.mediafire.com/file/s5wsyf688c2cjfc/EAGLEIOS.tipa/file", desc: "cần key", icon: "fa-file-archive" },
        { title: "Menu Kai", url: "https://www.mediafire.com/file/snn5ndu4ajl4b8z/duyphapioscrack.tipa/file", desc: "Tải file duyphapioscrack.tipa", icon: "fa-list-ul" }
      ]
    },
    adr: {
      menu: [
        { title: "kenb21 v8", url: "https://www.mediafire.com/file/0xmbksplfai8x5t/MENU+B211+V8.apk/file", desc: "cần key", icon: "fa-list-ul" }
      ],
      menuapk: [],  // Đã xóa toàn bộ link
      proxy: [],
      fileaim: [],
      deta: []
    },
    key: {
      ios: [
        { title: "Get Key FF Max", url: "https://authtool.app/get-key/?code=a2e08cd0-7c92-46c0-a1d2-71ebe8831362", desc: "Lấy key Free Fire MAX", icon: "fa-key" },
        { title: "Get Key EAGLEIOS", url: "https://link4m.net/yOvicLan", desc: "Lấy key EAGLEIOS", icon: "fa-key" },
        { title: "Get Key Aimkill", url: "https://link4m.org/xHCa3la", desc: "Lấy key Aimkill", icon: "fa-key" }
      ],
      android: [
        { title: "get key kenb21 v8", url: "https://link4m.org/qVr6KV9D", desc: "Lấy key kenb21 v8", icon: "fa-key" }
      ]
    },
    modskin: [] // Đã xóa toàn bộ link
  };

  let currentMain = 'ios';
  let currentIosSub = 'filza';
  let currentAdrSub = 'menu';
  let currentKeySub = 'ios';
  let pendingUrl = '';

  const mainTabs = document.getElementById('mainTabs');
  const iosSubTabs = document.getElementById('iosSubTabs');
  const adrSubTabs = document.getElementById('adrSubTabs');
  const keySubTabs = document.getElementById('keySubTabs');
  const content = document.getElementById('content');
  const modal = document.getElementById('modal');

  function renderLinks(links) {
    if (!links || links.length === 0) {
      content.innerHTML = `<div class="empty-message"><i class="fas fa-inbox"></i>Chưa có link</div>`;
      return;
    }
    content.innerHTML = links.map((link, i) => `
      <div class="link-card" style="animation-delay:${i*0.05}s">
        <div class="link-info">
          <div class="link-icon"><i class="fas ${link.icon}"></i></div>
          <div class="link-text">
            <div class="link-title">${link.title}</div>
            <div class="link-desc">${link.desc}</div>
          </div>
        </div>
        <button class="visit-btn" onclick="openModal('${link.title}', '${link.url}')">Mở</button>
      </div>
    `).join('');
  }

  function updateMainButtons() {
    mainTabs.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.main === currentMain);
    });
  }

  function updateSubButtons(container, activeSub) {
    container.querySelectorAll('.sub-tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.sub === activeSub);
    });
  }

  function switchMain(main) {
    currentMain = main;
    updateMainButtons();

    iosSubTabs.classList.add('hidden');
    adrSubTabs.classList.add('hidden');
    keySubTabs.classList.add('hidden');

    if (main === 'ios') {
      iosSubTabs.classList.remove('hidden');
      updateSubButtons(iosSubTabs, currentIosSub);
      renderLinks(data.ios[currentIosSub]);
    } else if (main === 'adr') {
      adrSubTabs.classList.remove('hidden');
      updateSubButtons(adrSubTabs, currentAdrSub);
      renderLinks(data.adr[currentAdrSub]);
    } else if (main === 'key') {
      keySubTabs.classList.remove('hidden');
      updateSubButtons(keySubTabs, currentKeySub);
      renderLinks(data.key[currentKeySub]);
    } else if (main === 'modskin') {
      renderLinks(data.modskin);
    }
  }

  function switchSub(sub) {
    if (currentMain === 'ios') {
      currentIosSub = sub;
      updateSubButtons(iosSubTabs, sub);
      renderLinks(data.ios[sub]);
    } else if (currentMain === 'adr') {
      currentAdrSub = sub;
      updateSubButtons(adrSubTabs, sub);
      renderLinks(data.adr[sub]);
    } else if (currentMain === 'key') {
      currentKeySub = sub;
      updateSubButtons(keySubTabs, sub);
      renderLinks(data.key[sub]);
    }
  }

  function openModal(title, url) {
    pendingUrl = url;
    document.getElementById('modalTitle').textContent = 'Tải: ' + title;
    document.getElementById('modalDesc').textContent = 'Bạn có muốn tải file này không?';
    modal.classList.add('active');
  }

  function closeModal() {
    modal.classList.remove('active');
    pendingUrl = '';
  }

  function confirmDownload() {
    if (pendingUrl) {
      window.open(pendingUrl, '_blank');
      closeModal();
    }
  }

  mainTabs.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchMain(btn.dataset.main)));
  iosSubTabs.querySelectorAll('.sub-tab-btn').forEach(btn => btn.addEventListener('click', () => switchSub(btn.dataset.sub)));
  adrSubTabs.querySelectorAll('.sub-tab-btn').forEach(btn => btn.addEventListener('click', () => switchSub(btn.dataset.sub)));
  keySubTabs.querySelectorAll('.sub-tab-btn').forEach(btn => btn.addEventListener('click', () => switchSub(btn.dataset.sub)));

  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  switchMain('ios');
</script>
</body>
</html>
